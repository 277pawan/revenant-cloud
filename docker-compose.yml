services:
  postgres:
    image: postgres:16
    container_name: revenant-cloud-db
    environment:
      POSTGRES_USER: revenant
      POSTGRES_PASSWORD: revenant
      POSTGRES_DB: revenant_cloud
    ports:
      - "5433:5432"
    volumes:
      - revenant_cloud_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revenant -d revenant_cloud"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  revenant_cloud_data:
